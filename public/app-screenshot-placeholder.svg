<svg width="250" height="500" viewBox="0 0 250 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="250" height="500" fill="#34B5B3"/>
  
  <!-- Status Bar -->
  <rect x="0" y="0" width="250" height="40" fill="#2a9290"/>
  <text x="20" y="25" font-family="system-ui, sans-serif" font-size="12" fill="#EDFBFA" opacity="0.9">9:41</text>
  <text x="220" y="25" font-family="system-ui, sans-serif" font-size="12" fill="#EDFBFA" opacity="0.9">100%</text>
  
  <!-- Header -->
  <rect x="20" y="60" width="210" height="60" fill="#2a9290" rx="15"/>
  <text x="125" y="85" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDFBFA" text-anchor="middle">Ocean</text>
  <text x="125" y="105" font-family="system-ui, sans-serif" font-size="12" fill="#EDFBFA" opacity="0.8" text-anchor="middle">Find Your Match</text>
  
  <!-- Profile Cards -->
  <rect x="30" y="140" width="190" height="280" fill="#EDFBFA" rx="20"/>
  <rect x="40" y="150" width="170" height="120" fill="#f0fcfc" rx="10"/>
  <circle cx="125" cy="190" r="25" fill="#34B5B3"/>
  <text x="125" y="195" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#EDFBFA" text-anchor="middle">JS</text>
  <text x="125" y="230" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#2a9290" text-anchor="middle">Jane, 28</text>
  <text x="125" y="250" font-family="system-ui, sans-serif" font-size="12" fill="#34B5B3" text-anchor="middle">Software Engineer</text>
  
  <!-- Match percentage -->
  <rect x="50" y="290" width="150" height="25" fill="#34B5B3" rx="12"/>
  <text x="125" y="305" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#EDFBFA" text-anchor="middle">95% Match</text>
  
  <!-- Interests -->
  <rect x="50" y="330" width="40" height="20" fill="#f0fcfc" rx="10"/>
  <text x="70" y="342" font-family="system-ui, sans-serif" font-size="10" fill="#2a9290" text-anchor="middle">Tech</text>
  <rect x="100" y="330" width="40" height="20" fill="#f0fcfc" rx="10"/>
  <text x="120" y="342" font-family="system-ui, sans-serif" font-size="10" fill="#2a9290" text-anchor="middle">Travel</text>
  <rect x="150" y="330" width="40" height="20" fill="#f0fcfc" rx="10"/>
  <text x="170" y="342" font-family="system-ui, sans-serif" font-size="10" fill="#2a9290" text-anchor="middle">Music</text>
  
  <!-- Action Buttons -->
  <circle cx="80" cy="380" r="25" fill="#EDFBFA" stroke="#2a9290" stroke-width="2"/>
  <text x="80" y="385" font-family="system-ui, sans-serif" font-size="16" fill="#2a9290" text-anchor="middle">✕</text>
  
  <circle cx="170" cy="380" r="25" fill="#EDFBFA" stroke="#2a9290" stroke-width="2"/>
  <text x="170" y="385" font-family="system-ui, sans-serif" font-size="16" fill="#2a9290" text-anchor="middle">♥</text>
  
  <!-- Bottom Navigation -->
  <rect x="0" y="440" width="250" height="60" fill="#2a9290"/>
  <circle cx="50" cy="470" r="15" fill="#EDFBFA"/>
  <text x="50" y="475" font-family="system-ui, sans-serif" font-size="12" fill="#2a9290" text-anchor="middle">🏠</text>
  <circle cx="125" cy="470" r="15" fill="#34B5B3"/>
  <text x="125" y="475" font-family="system-ui, sans-serif" font-size="12" fill="#EDFBFA" text-anchor="middle">💬</text>
  <circle cx="200" cy="470" r="15" fill="#EDFBFA"/>
  <text x="200" y="475" font-family="system-ui, sans-serif" font-size="12" fill="#2a9290" text-anchor="middle">👤</text>
</svg>